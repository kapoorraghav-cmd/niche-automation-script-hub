<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Niche Automation Script Hub</title>
  <desc id="desc">Simple Python scripts that automate tedious office tasks: images, spreadsheets, PDFs, audio, file names and web pages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 58px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .sub { font: 400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #cbd5e1; }
      .chip { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .mono { font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94a3b8; }
      .prompt { fill: #34d399; }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect x="80" y="70" width="84" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="140" class="title">Niche Automation Script Hub</text>
  <text x="80" y="184" class="sub">Simple Python scripts that automate tedious office tasks.</text>
  <text x="80" y="216" class="sub">Drop your files in a folder, run one command, done.</text>

  <!-- Tool chips -->
  <g transform="translate(80 258)">
    <g>
      <rect width="168" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#38bdf8" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="6" fill="#38bdf8"/>
      <text x="40" y="28" class="chip">Images</text>
    </g>
    <g transform="translate(180 0)">
      <rect width="190" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="6" fill="#34d399"/>
      <text x="40" y="28" class="chip">Spreadsheets</text>
    </g>
    <g transform="translate(382 0)">
      <rect width="130" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#f472b6" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="6" fill="#f472b6"/>
      <text x="40" y="28" class="chip">PDFs</text>
    </g>
    <g transform="translate(524 0)">
      <rect width="138" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="6" fill="#fbbf24"/>
      <text x="40" y="28" class="chip">Audio</text>
    </g>
    <g transform="translate(674 0)">
      <rect width="170" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="6" fill="#a78bfa"/>
      <text x="40" y="28" class="chip">File names</text>
    </g>
    <g transform="translate(856 0)">
      <rect width="170" height="44" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#fb923c" stroke-opacity="0.5"/>
      <circle cx="24" cy="22" r="6" fill="#fb923c"/>
      <text x="40" y="28" class="chip">Web pages</text>
    </g>
  </g>

  <text x="80" y="350" class="mono"><tspan class="prompt">$</tspan> python image_compressor.py   <tspan fill="#64748b">938 KB &#8594; 192 KB &#10003;</tspan></text>
</svg>
