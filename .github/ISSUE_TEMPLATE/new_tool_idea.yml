name: New tool idea
description: Suggest a boring office task you'd like a script to do for you.
title: "Tool idea: "
labels: ["tool idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! You don't need to know any code — just describe the task.
  - type: textarea
    id: task
    attributes:
      label: What task do you want to automate?
      description: Describe what you do by hand today, step by step.
      placeholder: Every Monday I copy the totals from 12 spreadsheets into one summary file...
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: What goes in?
      description: What kind of files or information would you give the tool?
      placeholder: A folder of .xlsx files, all with the same columns.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What should come out?
      placeholder: One summary spreadsheet with a row per file.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often do you do this task?
      options:
        - Daily
        - Weekly
        - Monthly
        - Now and then
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Example file names, tools you use today, or links to similar tools.
    validations:
      required: false
